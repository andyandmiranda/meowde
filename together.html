<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFF9EF"><title>함께 공부하기 · Meowde</title><link rel="stylesheet" href="/assets/five-tab-practice-nav.css?v=2"><style>
:root{--ink:#2D2A28;--muted:#706961;--line:#E8DED0;--mint:#53C7A0}*{box-sizing:border-box}body{margin:0;background:#FFF9EF;color:var(--ink);font:15px/1.55 "Pretendard Variable",Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:430px;margin:auto;padding:24px 18px 108px}header{display:flex;align-items:center;gap:10px;margin-bottom:24px}header a{font-weight:850;font-size:22px;color:var(--ink);text-decoration:none}h1{font-size:27px;letter-spacing:-.04em;margin:0 0 7px}h2{font-size:17px;margin:0 0 12px}p{color:var(--muted);margin:0 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}.card p{font-size:13px}label{display:block;font-weight:750;font-size:13px;margin:10px 0 6px}input{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:13px;padding:12px;font:inherit}button.primary,a.primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:0;border-radius:15px;background:var(--mint);color:#193f33;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;margin-top:14px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #247b61;outline-offset:2px}.notice{font-size:12px}.invite{border-left:4px solid var(--mint)}.invite strong{font-size:18px}#status{min-height:22px;font-size:13px;color:#247b61}.meowde-lab-tabbar a[aria-current=page]{background:#E7F8F0;color:#247B61}</style><link rel="stylesheet" href="/assets/shared-five-tab-shell.css?v=1"><style>main{max-width:760px;padding-top:12px}@media(max-width:480px){main{max-width:430px}}.meowde-shell-header{margin-bottom:6px}.meowde-shell-brand a{font-size:23px}.meowde-shell-brand small{margin:3px 0 0}.meowde-shell-subject{width:auto}.meowde-lab-tabbar a[aria-current="page"]{background:#e7f8f0;color:#247b61;border:1.5px solid #bdebd8}</style><link rel="stylesheet" href="/assets/app-shell-canonical.css?v=1"></head>
<body><header class="meowde-shell-header" aria-label="상단 메뉴"><div class="meowde-shell-brand"><img src="/assets/meowde-approved-base.svg?v=450" width="38" height="38" alt=""><div><a href="/?tab=home">Meowde</a><small>함께 · 학습 초대</small></div></div><select class="meowde-shell-subject" aria-label="과목 선택" onchange="location.assign(this.value==='linux'?'/together.html?subject=linux':this.value==='ml'?'/ml-foundations.html':'/together.html')"><option value="python">Python</option><option value="linux">Linux</option><option value="ml">ML 입문</option></select></header><main><h1>함께 공부해요</h1><p>친구에게 학습 초대 링크를 보내고 같은 주제에서 시작해요.</p>
<section id="received" class="card invite" hidden><h2>도착한 학습 초대</h2><p id="received-name"></p><strong id="received-topic"></strong><a class="primary" href="/?tab=map">학습 시작하기</a></section>
<section class="card"><h2>친구 초대하기</h2><label for="name">보내는 사람 이름 (선택)</label><input id="name" maxlength="30" autocomplete="nickname" placeholder="예: 코딩냥"><label for="topic">함께 공부할 주제</label><input id="topic" maxlength="70" value="Python 기초" required><button type="button" class="primary" id="share">초대 링크 공유하기</button><p id="status" role="status" aria-live="polite"></p><label for="link">초대 링크</label><input id="link" readonly aria-label="생성된 초대 링크" placeholder="공유 버튼을 누르면 생성돼요"></section>
<p class="notice">초대 링크는 누구나 열 수 있어요. 이름이나 주제에 민감한 정보를 적지 마세요. 실시간 공동 학습·친구 상태 공유 기능은 제공하지 않으며, 서로의 학습 기록은 공유되지 않아요.</p></main>
<nav class="meowde-lab-tabbar" aria-label="메인 메뉴"><a href="/?tab=home" aria-label="홈"><span class="lab-nav-icon" aria-hidden="true">⌂</span><span>홈</span></a><a href="/?tab=map" aria-label="학습"><span class="lab-nav-icon" aria-hidden="true">◫</span><span>학습</span></a><a href="/python-lab.html?view=overview" aria-label="심화"><span class="lab-nav-icon" aria-hidden="true">‹/›</span><span>심화</span></a><a href="/together.html" aria-label="함께" aria-current="page"><span class="lab-nav-icon" aria-hidden="true">♡</span><span>함께</span></a><a href="/?tab=my" aria-label="마이"><span class="lab-nav-icon" aria-hidden="true">♧</span><span>마이</span></a></nav>
<script>(function(){const p=new URLSearchParams(location.search),received=document.getElementById('received'),name=document.getElementById('name'),topic=document.getElementById('topic'),link=document.getElementById('link'),status=document.getElementById('status');if(p.get('subject')==='linux'){document.documentElement.style.setProperty('--mint','#F5DDE5');const theme=document.createElement('style');theme.textContent='body{background:#FFFFFF;color:#38343A}main{background:#FFFFFF}.card{border-color:#EEE7EC;box-shadow:none}.invite{border-left-color:#B77F94}.meowde-lab-tabbar{background:#FFFFFF;border-top-color:#EEE7EC}.meowde-lab-tabbar a[aria-current=page]{background:#FAF5F7;color:#80556A}button.primary,a.primary{color:#38343A}button:focus-visible,a:focus-visible,input:focus-visible{outline-color:#80556A}#status{color:#80556A}';document.head.append(theme);document.querySelector('.meowde-shell-brand a').href='/linux-home.html?tab=home';document.querySelector('.meowde-shell-subject').value='linux';const tabs=document.querySelectorAll('.meowde-lab-tabbar a');tabs[0].href='/linux-home.html?tab=home';tabs[1].href='/linux-home.html?tab=learn';tabs[2].href='/linux-crash-course.html?view=concept';tabs[4].href='/linux-home.html?tab=my';document.getElementById('received').querySelector('a.primary').href='/linux-home.html?tab=learn';topic.value='Linux 기초';}if(p.has('topic')){const t=p.get('topic').trim().slice(0,70),n=(p.get('from')||'친구').trim().slice(0,30);if(t){received.hidden=false;document.getElementById('received-topic').textContent=t;document.getElementById('received-name').textContent=n+'님이 함께 공부하자고 초대했어요.';topic.value=t}}document.getElementById('share').addEventListener('click',async()=>{const t=topic.value.trim(),n=name.value.trim();if(!t){status.textContent='함께 공부할 주제를 입력해 주세요.';topic.focus();return}const url=new URL('/together.html',location.origin);if(p.get('subject')==='linux')url.searchParams.set('subject','linux');url.searchParams.set('topic',t.slice(0,70));if(n)url.searchParams.set('from',n.slice(0,30));link.value=url.href;const message=(n||'친구')+'님이 Meowde에서 '+t+' 학습에 초대했어요.';if(navigator.share){try{await navigator.share({title:'Meowde 학습 초대',text:message,url:url.href});status.textContent='공유 창을 열었어요.';return}catch(e){if(e.name==='AbortError'){status.textContent='공유를 취소했어요. 링크를 복사할 수 있어요.';return}}}try{await navigator.clipboard.writeText(url.href);status.textContent='초대 링크를 복사했어요.'}catch(e){link.focus();link.select();status.textContent='링크가 생성됐어요. 선택된 주소를 복사해 보내세요.'}})})();</script><script src="/assets/app-shell-icons.js?v=1"></script></body></html>
