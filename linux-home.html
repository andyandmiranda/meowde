<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFF9EF"><title>Linux 학습 · MEOWDE</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>:root{--mint:#53C7A0;--cream:#FFF9EF;--ink:#2D2A28;--muted:#706762;--line:#E8DED0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#FFF4DA,#E8F8F0);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;color:var(--ink)}main{max-width:680px;min-height:100dvh;margin:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom));background:var(--cream)}a{color:inherit;text-decoration:none}.back{display:inline-flex;min-height:44px;align-items:center;font-size:.86rem;font-weight:700}h1{font-size:1.75rem;letter-spacing:-.04em;margin:20px 0 8px}p{line-height:1.6}.muted{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:20px;margin:18px 0}.pill{display:inline-block;color:#16694f;background:#E7F8F0;border-radius:99px;padding:6px 12px;font-size:.78rem;font-weight:800}.btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:12px 16px;border-radius:14px;background:var(--mint);font-weight:800;color:#18392f;margin-top:16px}.link{display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:12px 2px;border-bottom:1px solid var(--line);font-weight:700}.link:last-child{border-bottom:none}.progress{height:8px;border-radius:99px;overflow:hidden;background:#F0E7DA}.progress>span{display:block;background:var(--mint);height:100%;width:0}a:focus-visible{outline:3px solid #155fdd;outline-offset:3px}small{color:var(--muted)}@media(min-width:600px){main{padding:32px}}</style></head>
<body><main><a class="back" href="/">← MEOWDE 홈</a><header><div style="display:flex;align-items:center;gap:14px"><div id="meowde-mascot" aria-label="MEOWDE 기존 고양이 캐릭터" role="img" style="flex:none;width:88px;height:88px"></div><div><span class="pill">Linux · STEP 1</span><h1>Linux, 하나씩 배워요</h1><p class="muted">오늘은 딱 하나만. 명령어를 배우고 직접 써봐요.</p></div></div></header>
<section class="card" aria-labelledby="now-title"><span class="pill">이어서 학습</span><h2 id="now-title">E1 · 폴더 만들기</h2><p class="muted">개념 → 예시 → 직접 실습 → 응용 문제</p><div class="progress" role="progressbar" aria-label="개념 퀴즈 완료 진도" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0" id="course-progress"><span id="course-bar"></span></div><small id="course-count">개념 학습 0 / 9</small><a class="btn" href="/linux-crash-course.html#micro-e1">학습 시작하기 →</a></section>

<script>function catSVG(kind='a',mood='idle',size=80){
 const palettes={a:['#FFF7EC','#43352F','#FFB6A2','#E7F8F0'],b:['#F7F2FF','#373145','#C7BAFF','#FFF2C7'],c:['#FFFDF8','#2F2B28','#96D9BD','#DDF4FF']};
 const p=palettes[kind]||palettes.a;
 const eyes={
  idle:'<ellipse cx="43" cy="56" rx="4.4" ry="5.6" fill="'+p[1]+'"/><ellipse cx="77" cy="56" rx="4.4" ry="5.6" fill="'+p[1]+'"/><circle cx="44.6" cy="53.8" r="1.7" fill="#fff"/><circle cx="78.6" cy="53.8" r="1.7" fill="#fff"/>',
  happy:'<path d="M38.5 52l8 4.2l-8 4.2M81.5 52l-8 4.2l8 4.2" fill="none" stroke="'+p[1]+'" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>',
  focus:'<path d="M39 56h10M71 56h10" fill="none" stroke="'+p[1]+'" stroke-width="4" stroke-linecap="round"/>',
  oops:'<ellipse cx="43" cy="56" rx="5" ry="6.4" fill="'+p[1]+'"/><ellipse cx="77" cy="56" rx="5" ry="6.4" fill="'+p[1]+'"/><circle cx="44.8" cy="53.4" r="1.9" fill="#fff"/><circle cx="78.8" cy="53.4" r="1.9" fill="#fff"/>'
 }[mood]||'';
 const nose='<path d="M56.8 64h6.4l-3.2 3.6z" fill="'+p[1]+'" stroke="'+p[1]+'" stroke-width="1.6" stroke-linejoin="round"/>';
 const mouth=mood==='oops'?'<path d="M55 74q5-4 10 0" fill="none" stroke="'+p[1]+'" stroke-width="3" stroke-linecap="round"/>':'<path d="M53.5 70.5q3.5 3.6 6.5 0q3.5 3.6 6.5 0" fill="none" stroke="'+p[1]+'" stroke-width="3" stroke-linecap="round"/>';
 const blush=(mood==='happy'||mood==='idle')?'<circle cx="31" cy="66" r="4.2" fill="'+p[2]+'" opacity="'+(mood==='happy'?'.6':'.35')+'"/><circle cx="89" cy="66" r="4.2" fill="'+p[2]+'" opacity="'+(mood==='happy'?'.6':'.35')+'"/>':'';
 const whisk='<g stroke="'+p[1]+'" stroke-width="2.2" stroke-linecap="round" opacity=".38"><path d="M23 63h15M23.5 69l15-3.3M97 63H82M96.5 69l-15-3.3"/></g>';
 return `<svg width="${size}" height="${size}" viewBox="0 0 120 112" aria-hidden="true"><g stroke="${p[1]}" stroke-linejoin="round"><path d="M28.5 42 37.5 18 56 35" fill="${p[0]}" stroke-width="4.5"/><path d="M91.5 42 82.5 18 64 35" fill="${p[0]}" stroke-width="4.5"/><path d="M37.5 30 41 22 48.5 34" fill="${p[2]}" stroke-width="2.5" opacity=".65"/><path d="M82.5 30 79 22 71.5 34" fill="${p[2]}" stroke-width="2.5" opacity=".65"/><path d="M23 60c0-23 17-38 37-38s37 15 37 38c0 22-15 35-37 35S23 82 23 60z" fill="${p[0]}" stroke-width="4.5"/></g>${eyes}${nose}${mouth}${blush}${whisk}</svg>`}

(function(){"use strict";document.getElementById("meowde-mascot").innerHTML=catSVG("a","idle",88);try{const state=JSON.parse(localStorage.getItem("meowde-linux-cram-v1")||"{}");const count=Object.values(state?.done||{}).filter(Boolean).length;const n=Math.max(0,Math.min(9,count));document.getElementById("course-count").textContent="개념 학습 "+n+" / 9";document.getElementById("course-bar").style.width=(n/9*100)+"%";document.getElementById("course-progress").setAttribute("aria-valuenow",String(n))}catch(e){}})();</script></body></html>
