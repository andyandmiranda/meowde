<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>딥러닝 학습으로 이동 · MEOWDE</title>
<meta name="robots" content="noindex">
<style>
body{font:16px/1.6 system-ui,sans-serif;background:#fffafc;color:#38343a;margin:0}
main{max-width:430px;margin:64px auto;padding:24px}
a{display:inline-block;min-height:44px;line-height:44px;color:#80556a}
</style>
</head>
<body>
<main>
<h1>딥러닝 학습</h1>
<p>기존 학습 기록을 변경하지 않고 통합 딥러닝 화면으로 이동합니다.</p>
<a id="continue" href="/deep-learning.html?tab=home">딥러닝 학습 열기</a>
</main>
<script>
(function(){
'use strict';
const tab=new URLSearchParams(location.search).get('tab')==='my'?'my':'home';
const destination='/deep-learning.html?tab='+tab;
document.getElementById('continue').href=destination;
location.replace(destination);
})();
</script>
</body>
</html>
