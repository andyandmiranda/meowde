name: Validate isolated five-tab practice fix

on:
  pull_request:
    branches:
      - codex/unified-subject-hub-20261015
    paths:
      - 'python-lab.html'
      - 'assets/five-tab-practice-nav.css'
      - 'assets/python-lab-entry.js'
      - 'assets/python-lab.js'
      - 'assets/learning-surface-ui.css'
      - 'v413-core.js'
      - 'v414-screens.js'
      - 'index.html'
      - 'tests/focused-review.spec.cjs'
      - 'tests/five-tab-practice-nav.spec.cjs'
      - '.github/workflows/five-tab-practice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-tab-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run isolated five-tab regression
        run: pnpm exec playwright test tests/five-tab-practice-nav.spec.cjs tests/focused-review.spec.cjs
      - name: Run existing validation suite
        run: pnpm validate
