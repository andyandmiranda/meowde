name: Restore Release Format Temp
on:
  push:
    branches:
      - agent/curriculum-quality-v1
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/curriculum-quality-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore main formatting and add v453 entries
        run: |
          git fetch origin main
          git show origin/main:v434-release.js > /tmp/v434-main.js
          node - <<'NODE'
          const fs=require('fs');
          let src=fs.readFileSync('/tmp/v434-main.js','utf8');
          src=src.replace(
            'const ENHANCEMENT_APIS=["MeowCurriculum","MeowMapTouch","MeowVisualCohesion","MeowUpdateRecovery","MeowCharacterCutouts","MeowContact"];',
            'const ENHANCEMENT_APIS=["MeowCurriculum","MeowCurriculumPractice","MeowMapTouch","MeowVisualCohesion","MeowUpdateRecovery","MeowCharacterCutouts","MeowContact"];'
          );
          const anchor='    {id:"meowde-v452-curriculum",script:"v452-curriculum.js",version:"452",readyGlobal:"MeowCurriculum",warning:"Curriculum enhancement could not be loaded."},';
          const extra='\n    {id:"meowde-v453-curriculum-practice",script:"v453-curriculum-practice.js",version:"453",readyGlobal:"MeowCurriculumPractice",warning:"Curriculum practice enhancement could not be loaded."},';
          if(!src.includes(anchor))throw new Error('v452 anchor missing');
          src=src.replace(anchor,anchor+extra);
          fs.writeFileSync('v434-release.js',src);
          NODE
      - name: Commit formatting restoration
        run: |
          if git diff --quiet -- v434-release.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v434-release.js
          git commit -m "Preserve release guard formatting for v4.53"
          git push origin HEAD:agent/curriculum-quality-v1
