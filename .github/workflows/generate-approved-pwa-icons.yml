name: Generate approved PNG install icons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  approved-icons:
    if: github.ref == 'refs/heads/integration/meowde-ux-review-20261019'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Generate approved art PNGs
        run: python tools/generate-approved-pwa-icons.py
      - name: Validate generated PNGs and prevent old icons
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("icons")
          for n,s in [("meowde-approved-192.png",192),("meowde-approved-512.png",512),("meowde-approved-maskable-192.png",192),("meowde-approved-maskable-512.png",512),("meowde-approved-touch-180.png",180)]:
              with Image.open(root/n) as im:
                  assert im.format=="PNG" and im.size==(s,s), n
          assert not list(root.glob("meowde-[0-9]*.png"))
          PY
      - name: Commit new assets to this PR branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "integration/meowde-ux-review-20261019"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/meowde-approved-*.png
          git diff --cached --quiet && exit 0
          git commit -m "assets(pwa): generate approved PNG install icons"
          git push origin HEAD:refs/heads/integration/meowde-ux-review-20261019
