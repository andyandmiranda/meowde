name: Validate Meowde

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate JavaScript syntax
        run: |
          node --check sw.js
          node --check v413-core.js
          node --check v413-lesson.js
          node --check v414-state.js
          node --check v414-reward.js
          node --check v414-screens.js
          node --check v415-retention.js
          node --check v416-journey.js
          node --check v417-review.js
          node --check v418-coach.js
          node --check v419-achievements.js
          node --check v420-profile.js
          node --check v422-pwa.js
          node --check v425-playful.js
          node --check v427-growth.js
          node --check v428-events.js
          node --check v429-quests.js
          node --check v430-character.js
          node --check v432-humor.js
          node --check v433-learning.js
          node --check v434-release.js
          node --check v443-single-companion.js
          node --check v444-visual-cohesion.js
          node --check v449-character-cutouts.js
          node --check v451-contact.js
          node --check tools/validate-phase2-daily.js
          node --check tools/validate-phase3-surfaces.js
          node --check tools/validate-phase4-lesson.js
          node --check tools/validate-phase5-lesson-renderer.js
          node --check tools/validate-phase5-room-renderer.js
          node --check tools/validate-phase5-home-renderer.js
          node --check tools/validate-phase5-learn-renderer.js
          node --check tools/validate-phase5-review-renderer.js
          node --check tools/validate-phase5-secondary-renderers.js

      - name: Validate Phase 2 daily consolidation
        run: node tools/validate-phase2-daily.js

      - name: Validate Phase 3 surface separation
        run: node tools/validate-phase3-surfaces.js

      - name: Validate Phase 4 lesson simplification
        run: node tools/validate-phase4-lesson.js

      - name: Validate Phase 5 canonical Lesson renderer
        run: node tools/validate-phase5-lesson-renderer.js

      - name: Validate Phase 5 canonical Room renderer
        run: node tools/validate-phase5-room-renderer.js

      - name: Validate Phase 5 canonical Home renderer
        run: node tools/validate-phase5-home-renderer.js

      - name: Validate Phase 5 canonical Learn renderer
        run: node tools/validate-phase5-learn-renderer.js

      - name: Validate Phase 5 canonical Review renderer
        run: node tools/validate-phase5-review-renderer.js

      - name: Validate Phase 5 secondary renderers
        run: node tools/validate-phase5-secondary-renderers.js

      - name: Run validation suite
        run: npm run validate

      - name: Validate runtime fallback
        id: fallback
        shell: bash
        run: |
          set -o pipefail
          npm run validate:fallback 2>&1 | tee fallback-validation.log

      - name: Upload fallback diagnostics
        if: failure() && steps.fallback.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fallback-validation-log
          path: fallback-validation.log
          if-no-files-found: error
          retention-days: 7