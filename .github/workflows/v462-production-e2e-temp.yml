name: Temporary Unit 06 Production E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit6-production-e2e:
    if: github.head_ref == 'agent/v462-production-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Unit 06 Production E2E
        run: |
          sed -i 's/pathState.firstLabel.includes("클래스")/(pathState.firstLabel.includes("class")||pathState.firstLabel.includes("객체"))/' tools/v462-production-e2e.mjs
          node tools/v462-production-e2e.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meowde-unit6-production-e2e
          path: v462-e2e-artifacts
          if-no-files-found: warn
          retention-days: 7
