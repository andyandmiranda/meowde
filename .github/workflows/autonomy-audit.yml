name: MEOWDE autonomy safety audit

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/autonomy-audit.yml'
      - 'docs/OPERATIONS.md'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: meowde-autonomy-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only repository safety audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          node <<'NODE'
          const repo = process.env.REPO;
          const headers = {
            Authorization: 'Bearer ' + process.env.GH_TOKEN,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          async function get(path) {
            const response = await fetch('https://api.github.com/repos/' + repo + path, {headers});
            if (!response.ok) throw new Error(path + ': HTTP ' + response.status);
            return response.json();
          }
          (async () => {
            const [pulls, runs, main] = await Promise.all([
              get('/pulls?state=open&per_page=100'),
              get('/actions/runs?branch=main&per_page=10'),
              get('/branches/main')
            ]);
            const automationPRs = pulls.filter(p => p.head.ref.startsWith('codex/') || p.head.ref.startsWith('automation/'));
            const failures = runs.workflow_runs.filter(r => r.status === 'completed' && ['failure','timed_out','cancelled'].includes(r.conclusion));
            const report = {
              checked_at: new Date().toISOString(),
              main_sha: main.commit.sha,
              main_protected: main.protected,
              open_automation_prs: automationPRs.map(p => ({number:p.number,draft:p.draft,head:p.head.sha})),
              recent_main_failures: failures.map(r => ({id:r.id,url:r.html_url,conclusion:r.conclusion}))
            };
            console.log(JSON.stringify(report,null,2));
            if (process.env.GITHUB_STEP_SUMMARY) {
              const fs = require('node:fs');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### MEOWDE read-only autonomy audit\n\n```json\n'+JSON.stringify(report,null,2)+'\n```\n');
            }
            const blocked = automationPRs.length >= 2 || failures.length > 0 || !main.protected;
            if (blocked) {
              console.error('AUTONOMY BLOCKED: review the report; no merge or deployment was attempted.');
              process.exitCode = 1;
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
