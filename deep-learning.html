"use strict";
const units=[{"id":"map","title":"전체 지도","story":"고양이 사진을 맞히려면 먼저 사진을 숫자로 바꾸고 모델에 넣어요. 모델은 예측하고 정답과 비교한 뒤 조금씩 수정해요. 이 과정을 반복한 뒤 처음 보는 사진을 판단해요.","concept":"데이터 → 모델 → 예측 → Loss → 수정 → 반복 → 새 데이터 추론","example":"학습 중: 입력 → 예측 → 정답 비교 → 수정\n학습 후: 새 입력 → 예측","check":{"q":"학습 중 정답과 예측을 비교하는 이유는?","choices":["모델을 수정할 근거를 얻기 위해","사진을 저장하기 위해","GPU를 끄기 위해"],"answer":0,"why":"비교 결과인 손실이 수정 방향을 판단할 근거가 돼요."},"apply":{"q":"모델이 틀린 예측을 했어요. 다음으로 필요한 단계는?","choices":["손실 계산","테스트 결과 발표","파일 삭제"],"answer":0,"why":"정답과 비교해 손실을 계산한 뒤 수정해요."},"recall":{"q":"학습과 추론의 차이는?","choices":["학습은 수정하고 추론은 새 입력을 예측한다","둘 다 항상 가중치를 바꾼다","추론은 정답이 반드시 필요하다"],"answer":0,"why":"추론은 보통 학습된 모델로 예측만 해요."}},{"id":"tensor","title":"데이터와 Tensor","story":"모델은 글이나 사진도 결국 숫자 배열로 다뤄요. 숫자 하나는 스칼라, 줄은 벡터, 표는 행렬로 생각할 수 있어요. 텐서는 이들을 포괄하는 다차원 배열이에요.","concept":"shape는 각 축에 값이 몇 개 있는지 나타내요. NumPy 배열과 텐서는 모양을 비교하며 이해할 수 있어요.","example":"[1,2,3] → (3,)\n[[1,2],[3,4]] → (2,2)","check":{"q":"[[1,2],[3,4]]의 shape는?","choices":["(4,)","(2,2)","(2,)"],"answer":1,"why":"2행 2열이므로 (2,2)예요."},"apply":{"q":"3개 숫자가 들어 있는 1차원 배열의 shape는?","choices":["(3,)","(1,3,1)","(3,3)"],"answer":0,"why":"한 축에 값 3개가 있어요."},"recall":{"q":"텐서의 shape가 말하는 것은?","choices":["축별 크기","정답률","학습률"],"answer":0,"why":"shape는 각 차원의 길이예요."}},{"id":"network","title":"신경망과 뉴런","story":"모델은 입력 특징을 받아 계산하고 출력을 만들어요. 뉴런 하나는 입력에 가중치를 곱하고 편향을 더해요. 여러 뉴런을 층으로 묶으면 신경망이 돼요.","concept":"weight는 입력의 영향력, bias는 기준을 조정해요.","example":"x=3, w=2, b=1 → z=2×3+1=7","check":{"q":"x=4,w=3,b=2의 z는?","choices":["12","14","18"],"answer":1,"why":"3×4+2=14예요."},"apply":{"q":"w=2,b=1,x=5일 때 z는?","choices":["11","10","7"],"answer":0,"why":"2×5+1=11이에요."},"recall":{"q":"뉴런의 두 매개변수는?","choices":["가중치와 편향","손실과 정확도","배치와 에포크"],"answer":0,"why":"가중치와 편향이 뉴런 계산을 조절해요."}},{"id":"activation","title":"활성화 함수","story":"층을 여러 개 쌓아도 계산이 전부 선형이면 복잡한 경계를 표현하기 어려워요. 활성화 함수는 비선형성을 더해요. ReLU는 음수면 0, 양수면 그대로 둬요.","concept":"활성화 함수는 층의 출력을 변환하고, 손실 함수는 예측과 정답의 차이를 측정해요.","example":"ReLU(-3)=0; ReLU(5)=5","check":{"q":"ReLU(-2)는?","choices":["-2","0","2"],"answer":1,"why":"ReLU는 max(0,x)예요."},"apply":{"q":"ReLU(7)는?","choices":["0","7","-7"],"answer":1,"why":"양수는 그대로 통과해요."},"recall":{"q":"활성화 함수와 손실 함수의 차이는?","choices":["출력 변환 vs 오류 측정","둘 다 파일 저장","둘 다 정확도"],"answer":0,"why":"활성화는 모델 내부 계산, 손실은 결과 비교에 쓰여요."}},{"id":"forward","title":"Forward와 Prediction","story":"입력은 첫 층을 지나 다음 층으로 전달돼요. 마지막 층의 출력이 예측이에요. 입력에서 출력 방향으로 계산하는 과정을 순전파라고 해요.","concept":"forward는 예측을 계산하는 과정이며, 학습 여부와 관계없이 추론에서도 사용돼요.","example":"입력 → 층1 → 활성화 → 층2 → 예측","check":{"q":"forward의 방향은?","choices":["입력에서 출력","손실에서 입력","저장소에서 GPU"],"answer":0,"why":"순전파는 입력에서 출력으로 진행돼요."},"apply":{"q":"입력 2, 첫 층이 2배, 다음 층이 +1이면 출력은?","choices":["3","5","6"],"answer":1,"why":"2×2+1=5예요."},"recall":{"q":"prediction은 언제 만들어지나요?","choices":["forward 후","모델 저장 후에만","테스트 삭제 후"],"answer":0,"why":"순전파가 모델 출력을 계산해요."}},{"id":"loss","title":"손실 함수","story":"모델이 답을 냈다고 학습이 끝나지는 않아요. 예측이 실제 답과 얼마나 다른지 숫자로 측정해야 해요. 이를 손실이라고 불러요.","concept":"MSE는 오차를 제곱해 평균낸 값이에요. Loss와 정확도는 같은 지표가 아니에요.","example":"정답 4, 예측 2 → 제곱오차 (4-2)²=4","check":{"q":"정답 3, 예측 5의 제곱오차는?","choices":["-2","2","4"],"answer":2,"why":"(3-5)²=4예요."},"apply":{"q":"정답 1, 예측 4의 제곱오차는?","choices":["9","3","-3"],"answer":0,"why":"차이 -3을 제곱하면 9예요."},"recall":{"q":"Loss가 하는 일은?","choices":["예측 오류 측정","GPU 선택","파일 압축"],"answer":0,"why":"Loss는 정답과 예측을 비교해요."}},{"id":"backprop","title":"Gradient와 역전파","story":"손실을 줄이려면 어떤 가중치를 어느 방향으로 움직일지 알아야 해요. 기울기는 손실이 매개변수 변화에 얼마나 민감한지 알려줘요. 역전파는 그 기울기를 뒤쪽 층에서 앞쪽 층으로 계산해 전달해요.","concept":"역전파는 기울기 계산이고, 매개변수 수정은 옵티마이저의 역할이에요.","example":"손실 → 출력층 기울기 → 앞쪽 층 기울기","check":{"q":"역전파의 주된 역할은?","choices":["기울기 계산","모델 파일 저장","GPU 성능 측정"],"answer":0,"why":"기울기를 전달하고 계산해요."},"apply":{"q":"손실을 줄이는 기울기 방향을 얻었어요. 실제 가중치 수정 담당은?","choices":["옵티마이저","검증 데이터","추론 함수"],"answer":0,"why":"기울기는 정보이고 옵티마이저가 업데이트해요."},"recall":{"q":"역전파와 업데이트는 같은 과정인가요?","choices":["아니요","네","GPU에서만 같아요"],"answer":0,"why":"서로 연결되지만 역할은 달라요."}},{"id":"optimizer","title":"Optimizer와 학습률","story":"기울기를 구했다면 이제 가중치를 움직여야 해요. 옵티마이저는 그 수정을 실행해요. 학습률은 한 번에 얼마나 움직일지 정해요. 너무 크면 지나치고 너무 작으면 느릴 수 있어요.","concept":"경사하강법 예: 새 w = 기존 w - 학습률 × 기울기","example":"w=5, lr=0.1, gradient=2 → w=4.8","check":{"q":"가중치를 직접 바꾸는 것은?","choices":["optimizer","loss","activation"],"answer":0,"why":"옵티마이저가 업데이트해요."},"apply":{"q":"w=3,lr=0.5,gradient=2이면 새 w는?","choices":["2","4","1"],"answer":0,"why":"3-0.5×2=2예요."},"recall":{"q":"학습률이 너무 크면?","choices":["최솟값을 지나칠 수 있다","정확도가 자동 증가한다","저장 불필요"],"answer":0,"why":"업데이트가 과도해 불안정할 수 있어요."}},{"id":"loop","title":"Training Loop","story":"한 번 예측했다고 모델이 충분히 배우지는 않아요. 데이터를 넣고 손실을 계산한 뒤 기울기와 업데이트를 반복해요. 이 반복이 학습 루프예요.","concept":"입력 → forward → loss → gradient → optimizer step → 반복","example":"zero_grad → prediction → loss → backward → step","check":{"q":"loss 계산 직후 필요한 것은?","choices":["gradient 계산","테스트셋 재학습","Drive 삭제"],"answer":0,"why":"손실을 기준으로 기울기를 계산해요."},"apply":{"q":"올바른 순서는?","choices":["예측→손실→역전파→업데이트","업데이트→예측→손실","저장→업데이트→입력"],"answer":0,"why":"예측 후 손실과 기울기를 구하고 업데이트해요."},"recall":{"q":"gradient 초기화가 필요한 이유는?","choices":["이전 반복의 기울기 누적을 피하기 위해","데이터를 삭제하기 위해","정확도 고정"],"answer":0,"why":"일부 프레임워크는 기울기를 누적하므로 반복 시작에 초기화해요."}},{"id":"batch","title":"Batch와 Epoch","story":"데이터가 100개라면 매번 전부를 한꺼번에 계산하지 않을 수 있어요. 여러 샘플을 묶은 것이 배치예요. 전체 학습 데이터를 한 번 훑으면 한 에포크예요.","concept":"batch size는 묶음 크기, iteration은 보통 한 배치 업데이트 단계예요.","example":"샘플 100개, 배치 크기 20 → 에포크당 5배치","check":{"q":"epoch의 뜻은?","choices":["전체 학습 데이터 1회 순회","샘플 하나","GPU 한 번 켜기"],"answer":0,"why":"전체 데이터 한 번을 뜻해요."},"apply":{"q":"100개 샘플, 배치 크기 25이면 에포크당 배치는?","choices":["4","25","100"],"answer":0,"why":"100÷25=4예요."},"recall":{"q":"batch size와 epoch 차이는?","choices":["묶음 크기 vs 전체 순회 횟수","둘 다 정확도","둘 다 저장 방식"],"answer":0,"why":"서로 다른 단위예요."}},{"id":"split","title":"Train·Validation·Test","story":"연습 문제만 잘 맞히는 학생이 처음 보는 시험도 잘 보는지는 따로 확인해야 해요. 모델도 학습용 데이터와 평가용 데이터를 구분해요.","concept":"train은 매개변수 학습, validation은 설정·학습 상태 확인, test는 마지막 일반화 성능 확인에 사용해요.","example":"train: 학습 / validation: 선택 / test: 최종 평가","check":{"q":"가중치 학습에 쓰는 데이터는?","choices":["train","test","validation만"],"answer":0,"why":"train 데이터로 파라미터를 학습해요."},"apply":{"q":"학습률 후보를 고르는 데 주로 사용하는 것은?","choices":["validation","test를 반복 확인","최종 평가 보고서"],"answer":0,"why":"validation을 사용해 설정을 선택해요."},"recall":{"q":"test를 반복 튜닝에 사용하면?","choices":["평가 신뢰성이 낮아질 수 있다","항상 더 공정해진다","학습이 멈춘다"],"answer":0,"why":"test 정보가 선택 과정에 새어 들어갈 수 있어요."}},{"id":"overfit","title":"과적합과 과소적합","story":"연습 문제 답을 외우기만 하면 새로운 문제를 틀릴 수 있어요. 모델도 학습 데이터에 지나치게 맞으면 검증 성능이 나빠질 수 있어요.","concept":"train loss만 계속 낮아지고 validation loss가 올라가면 과적합을 의심해요. 둘 다 높으면 과소적합 가능성을 검토해요.","example":"train loss ↓ / validation loss ↑ → 과적합 신호","check":{"q":"과적합 신호는?","choices":["train 개선·validation 악화","둘 다 개선","학습 시작 전"],"answer":0,"why":"새 데이터 일반화가 나빠지는 신호예요."},"apply":{"q":"epoch를 계속 늘리면 언제나 좋아질까요?","choices":["아니요","네","GPU일 때만"],"answer":0,"why":"과적합이 심해질 수 있어요."},"recall":{"q":"과소적합은?","choices":["학습 데이터에도 충분히 맞지 못함","테스트셋 저장","GPU 과열"],"answer":0,"why":"모델이 학습 패턴도 충분히 포착하지 못한 상태예요."}},{"id":"gpu","title":"CPU와 GPU","story":"CPU는 다양한 일을 빠르게 조정하고 GPU는 많은 수치 계산을 병렬로 처리하는 데 강해요. 딥러닝의 큰 행렬 계산을 GPU가 빠르게 할 수 있어요. 하지만 속도가 빨라진다고 정확도가 자동으로 높아지지는 않아요.","concept":"GPU 사용 시 모델과 입력 텐서가 같은 device에 있어야 해요.","example":"model: cuda / input: cpu → device mismatch","check":{"q":"GPU를 쓰면 정확도가 자동 상승하나요?","choices":["아니요","네","저장하면 상승"],"answer":0,"why":"GPU는 주로 계산 속도를 개선해요."},"apply":{"q":"모델이 GPU, 입력이 CPU이면?","choices":["device 불일치 오류 가능","항상 정상","정확도 증가"],"answer":0,"why":"계산 대상이 같은 device에 있어야 해요."},"recall":{"q":"GPU가 유용한 주된 이유는?","choices":["대량 병렬 계산","정답 자동 생성","데이터 영구 저장"],"answer":0,"why":"행렬·텐서 연산에 강점이 있어요."}},{"id":"colab","title":"Colab GPU 환경","story":"Colab은 브라우저에서 노트북 코드를 실행할 수 있는 외부 환경이에요. GPU를 선택해 계산할 수 있지만 제공 여부와 자원은 달라질 수 있어요. 런타임은 일시적이어서 종료되면 로컬 파일이 사라질 수 있어요.","concept":"MEOWDE는 개념 연습을 제공하며 실제 GPU 훈련은 외부 Colab에서 진행해요.","example":"런타임 종료 → 임시 저장 파일 손실 가능","check":{"q":"Colab 런타임의 특징은?","choices":["일시적일 수 있다","영구 보관함이다","모델이 자동 저장된다"],"answer":0,"why":"런타임 저장 공간은 영구 보관을 보장하지 않아요."},"apply":{"q":"GPU를 썼는데 파일을 런타임에만 저장했다면?","choices":["종료 시 손실 가능","항상 보존","Drive 자동 복사"],"answer":0,"why":"외부 보존이 필요해요."},"recall":{"q":"MEOWDE에서 실제 GPU 훈련이 되나요?","choices":["이 과정은 개념 연습만 제공","항상 가능","저장하면 가능"],"answer":0,"why":"실제 GPU 실습은 Colab 등 외부 환경이 필요해요."}},{"id":"save","title":"모델 저장 이유","story":"오래 학습한 모델을 매번 처음부터 다시 훈련할 필요는 없어요. 학습 결과를 파일로 남기면 나중에 불러와 예측할 수 있어요. 런타임이 끝나기 전에 외부에 보존하는 것이 중요해요.","concept":"weights는 학습된 매개변수, model은 구조와 계산, checkpoint는 보통 학습 재개 정보까지 포함할 수 있어요.","example":"Train → Save → Runtime 종료 → Load → Predict","check":{"q":"모델 저장이 필요한 이유는?","choices":["학습 결과 재사용","정확도 자동 증가","GPU 영구 활성화"],"answer":0,"why":"학습된 매개변수를 다시 활용해요."},"apply":{"q":"학습 후 런타임 종료 전 우선할 일은?","choices":["모델 파일을 외부에 보존","모델 삭제","test로 재학습"],"answer":0,"why":"임시 저장소 손실에 대비해요."},"recall":{"q":"weights와 checkpoint 차이는?","choices":["checkpoint는 재개 정보도 포함할 수 있다","항상 동일","weights는 사진"],"answer":0,"why":"checkpoint에는 옵티마이저 상태 등도 담을 수 있어요."}},{"id":"load","title":"Save·Load·재추론","story":"모델 파일을 저장했다면 정말 불러와 사용할 수 있는지 확인해야 해요. 새 런타임에서 모델 구조와 가중치를 준비한 뒤 새로운 입력으로 예측해요. 저장 성공 메시지만으로 검증이 끝나지 않아요.","concept":"실습에서는 모델 생성 → 학습 → 저장 → 재시작 가정 → 로드 → 추론을 확인해요.","example":"Train → Save → Load → Predict","check":{"q":"올바른 순서는?","choices":["Train→Save→Load→Predict","Load→Train→Save 없이 종료","Predict→삭제→Load"],"answer":0,"why":"학습 결과를 저장하고 불러와 새 예측을 해요."},"apply":{"q":"저장 파일을 불러왔는데 입력 shape가 틀리면?","choices":["shape 오류 가능","항상 정상","저장이 자동 수정"],"answer":0,"why":"로드 후에도 입력 형식을 맞춰야 해요."},"recall":{"q":"로드 검증에서 중요한 것은?","choices":["새 입력으로 추론 성공","파일명 암기","GPU만 확인"],"answer":0,"why":"재추론이 실제 복원을 확인해요."}},{"id":"drive","title":"Google Drive 보존","story":"Colab의 임시 디스크만 믿으면 런타임 종료 시 파일을 잃을 수 있어요. Drive에 복사하거나 파일을 내려받아 별도로 보관할 수 있어요. Drive 연결은 계정 인증과 권한을 요구해요.","concept":"MEOWDE는 Drive 인증을 자동 실행하지 않아요. 사용자가 외부 실습에서 필요한 권한을 확인해야 해요.","example":"Colab 임시 저장 → Drive 또는 다운로드 → 새 런타임에서 다시 불러오기","check":{"q":"Drive 연동 목적은?","choices":["런타임 밖에서 파일 보존","정확도 자동 개선","GPU 무료 보장"],"answer":0,"why":"파일을 런타임 외부에 보존하려는 목적이에요."},"apply":{"q":"Drive 권한 요청을 받으면?","choices":["범위를 확인하고 직접 결정","무조건 허용","MEOWDE에 비밀번호 입력"],"answer":0,"why":"인증과 권한은 사용자가 외부 서비스에서 관리해야 해요."},"recall":{"q":"런타임 종료 후에도 파일을 쓰려면?","choices":["외부에 저장","임시 폴더만 사용","저장 생략"],"answer":0,"why":"영구 저장소나 다운로드가 필요해요."}}];
const STORAGE_KEY='meowde-deep-foundations-v1';
const valid=new Set(units.map(u=>u.id));
const state={current:0,completed:new Set(),legacyDone:new Set(),stage:0,record:null,writable:true,warning:''};
const $=id=>document.getElementById(id);
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw===null)return;const d=JSON.parse(raw);if(!d||d.version!==1||!Array.isArray(d.done)||d.done.some(x=>!valid.has(x))||typeof d.current!=='string'||!valid.has(d.current))throw Error('invalid');state.record=d;state.legacyDone=new Set(d.done);state.completed=new Set(Array.isArray(d.verified)?d.verified.filter(x=>valid.has(x)&&d.done.includes(x)):[]);state.current=units.findIndex(u=>u.id===d.current);state.stage=Number.isInteger(d.stage)&&d.stage>=0&&d.stage<3?d.stage:0;if(state.completed.has(d.current))state.stage=3}catch(e){state.writable=false;state.warning='기존 기록을 읽지 못했어요. 원본을 덮어쓰지 않습니다.';}}
function save(){if(!state.writable){$('storage-status').textContent=state.warning;return false}const d={...(state.record||{}),version:1,current:units[state.current].id,done:units.filter(u=>state.legacyDone.has(u.id)||state.completed.has(u.id)).map(u=>u.id),verified:units.filter(u=>state.completed.has(u.id)).map(u=>u.id),stage:state.stage};try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));state.record=d;state.warning='';return true}catch(e){state.warning='저장 실패: 기존 기록을 유지했어요.';$('storage-status').textContent=state.warning;return false}}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function nav(){const n=$('units');n.classList.add('meowde-node-map');n.replaceChildren();units.forEach((u,i)=>{
 const b=el('button','meowde-node'+(state.completed.has(u.id)?' complete':''));b.type='button';b.setAttribute('aria-current',String(state.current===i));
 const pin=el('span','meowde-node-number',state.completed.has(u.id)?'✓':String(i+1).padStart(2,'0'));
 b.append(pin,el('strong','',u.title),el('small','',state.completed.has(u.id)?'완료':state.legacyDone.has(u.id)?'기존 학습 기록':'학습하기'));
 b.onclick=()=>{const previous=[state.current,state.stage];state.current=i;state.stage=state.completed.has(u.id)?3:0;if(!save()){[state.current,state.stage]=previous;return}
 const query=new URLSearchParams(location.search);query.set('tab','learn');query.set('unit',u.id);history.replaceState(null,'',location.pathname+'?'+query);render();};n.append(b)});
 $('progress-label').textContent=state.completed.size+' / '+units.length+' 단원 완료';$('progress-bar').style.width=(state.completed.size/units.length*100)+'%'}
function panel(u,kind){const task=u[kind],wrap=el('section','step'),feedback=el('p','feedback'),choices=el('div','choices');const label={check:'① 이해·구별',apply:'② 적용',recall:'③ 회상'}[kind];wrap.append(el('h3','',label),el('p','question',task.q),choices,feedback);task.choices.forEach((c,i)=>{const b=el('button','answer',c);b.type='button';b.onclick=()=>{if(state.stage!==['check','apply','recall'].indexOf(kind))return;const ok=i===task.answer;feedback.textContent=(ok?'정답이에요. ':'다시 생각해 봐요. ')+task.why+(ok?'':' 정답: '+task.choices[task.answer]);feedback.className='feedback '+(ok?'correct':'wrong');if(!ok)return;const previous=state.stage;state.stage++;const finishing=state.stage===3;const already=state.completed.has(u.id);if(finishing)state.completed.add(u.id);if(!save()){state.stage=previous;if(finishing&&!already)state.completed.delete(u.id);feedback.textContent='정답이지만 저장하지 못했어요. 현재 단계를 유지합니다. 저장 공간 또는 브라우저 설정을 확인하고 다시 시도해 주세요.';feedback.className='feedback wrong';return}if(finishing)nav();renderStage()};choices.append(b)});return wrap}
function renderStage(){const area=$('tasks');area.replaceChildren();const u=units[state.current],k=['check','apply','recall'][state.stage];if(!k){area.append(el('p','result','이해·적용·회상 완료 ✓'));const b=el('button','primary',state.current<units.length-1?'다음 단원 →':'전체 과정 마치기');b.onclick=()=>{if(state.current<units.length-1){const previous=[state.current,state.stage];state.current++;state.stage=state.completed.has(units[state.current].id)?3:0;if(!save()){[state.current,state.stage]=previous;return}render()}else{$('finish').classList.remove('hidden');$('lesson').classList.add('hidden')}};area.append(b);return}area.append(panel(u,k));if(k==='recall')$('concept-area').classList.add('hidden');else $('concept-area').classList.remove('hidden')}
function render(){nav();$('finish').classList.add('hidden');$('lesson').classList.remove('hidden');const u=units[state.current];$('lesson-title').textContent=u.title;$('story').textContent=u.story;$('concept').textContent=u.concept;$('example').textContent=u.example;$('concept-area').classList.remove('hidden');renderStage();$('storage-status').textContent=state.warning||'각 단원은 이해·적용·회상을 통과해야 완료됩니다.'}
load();
// Direct node links open the requested lesson without writing or resetting the saved record.
const entryUnit=new URLSearchParams(location.search).get('unit');
const entryIndex=units.findIndex(u=>u.id===entryUnit);
if(entryIndex>=0){state.current=entryIndex;state.stage=state.completed.has(entryUnit)?3:0;}
render();$('again').onclick=()=>{const previous=[state.current,state.stage];state.current=0;state.stage=state.completed.has(units[0].id)?3:0;if(!save()){[state.current,state.stage]=previous;return}render()};

</script><script src="/assets/app-shell-icons.js?v=1"></script><script src="/assets/meowde-subject-selector.js?v=2"></script></body></html>
