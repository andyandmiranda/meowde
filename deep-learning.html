<style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#38343a;background:#fffafc}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}main{max-width:430px;margin:auto;padding:16px 14px 112px}.top{display:flex;align-items:center;gap:10px;padding:7px 0 12px}.meowde-avatar{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#faeaf0;font-size:27px;flex-shrink:0}.meowde-avatar img{width:38px;height:38px;object-fit:contain}.brand small{display:block;font-size:10px;color:#827480;font-weight:500;margin-top:1px}.brand{font-weight:850;font-size:19px}.tag{font-size:11px;border-radius:15px;background:#faeaf0;color:#755264;padding:6px 8px;margin-left:auto}.sub{color:#706572;font-size:12px;margin:0 0 14px}h1{font-size:23px;letter-spacing:-.03em;margin:12px 0 6px}h2{font-size:19px;letter-spacing:-.02em;margin:0 0 8px}h3{font-size:15px;margin:0 0 10px}.card{background:white;border:1px solid #eee0e7;border-radius:18px;padding:16px;margin:13px 0}.units{display:grid;grid-template-columns:1fr 1fr;gap:8px}.unit{min-height:48px;border:1px solid #e4c9d7;border-radius:12px;background:white;color:#453943;font-size:12px;font-weight:700;padding:8px;text-align:left}.unit[aria-current="true"]{background:#f5dce8;border-color:#b37a95}.muted{color:#726670;font-size:13px;line-height:1.6}.kicker{font-size:11px;font-weight:800;color:#975774;letter-spacing:.04em}.concept{font-size:14px;line-height:1.7;margin:8px 0}.example{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,Consolas,monospace;background:#292d39;color:#fff;padding:13px;border-radius:12px}.choices{display:grid;gap:8px}.answer{min-height:48px;text-align:left;background:#fff;border:1px solid #d9c3cf;padding:10px 12px;border-radius:12px}.answer:focus-visible,.unit:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid #90546f;outline-offset:2px}.answer:disabled{opacity:.85}.answer.correct{border-color:#4c946d;background:#f1faf4}.answer.wrong{border-color:#b4667a;background:#fff1f5}.feedback{font-size:13px;line-height:1.65;padding:10px 12px;border-radius:11px;background:#f8f4f6;margin-top:10px;min-height:42px}.feedback:empty{display:none}.primary,.secondary{min-height:48px;border-radius:13px;padding:11px 16px;font-weight:750}.primary{border:1px solid #d6a9bf;background:#f5dce8;color:#453943;width:100%}.secondary{border:1px solid #e4d7df;background:white;color:#5b4552;width:100%}.hidden{display:none!important}.progress{height:7px;background:#f2e6ee;border-radius:20px;overflow:hidden;margin-top:6px}.progress i{display:block;background:#ba849e;height:100%;transition:width .12s}.mini{font-size:12px;color:#71616c}.footer{font-size:11px;color:#827480;text-align:center;padding:20px 0}.question{font-size:14px;font-weight:750;margin:8px 0 12px}.step{margin-top:15px}.icon{font-size:25px}.review{border-left:3px solid #c897ad;padding-left:12px;margin:12px 0}.result{font-weight:800;color:#5f4960} @media(max-width:340px){.card{padding:14px}.unit{font-size:11.5px}} .meowde-tabbar{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:430px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));min-height:69px;padding:5px 2px max(6px,env(safe-area-inset-bottom));border-top:1px solid #eee0e7;background:rgba(255,255,255,.97);z-index:20;box-shadow:0 -3px 20px #38263010}.meowde-tabbar a{min-height:52px;display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;border-radius:12px;text-decoration:none;color:#736875;font-size:21px;font-weight:700}.meowde-tabbar a span{font-size:11px}.meowde-tabbar .selected{background:#faf0f5;color:#80556a}.meowde-tabbar a:focus-visible{outline:3px solid #80556a;outline-offset:-3px} @media(max-width:340px){.tag{font-size:10px;padding:5px}.brand{font-size:17px}.brand small{font-size:9px}} </style><link rel="stylesheet" href="/assets/meowde-unified-shell-review.css?v=1"></head><body><main>
<div class="top"><span class="meowde-avatar" aria-hidden="true"><img src="/assets/meowde-approved-base.svg?v=450" alt="" onerror="this.hidden=true;this.parentElement.textContent='🐱'"></span><span class="brand">Meowde<small>고양이와 함께 배우는 AI</small></span><span class="tag">딥러닝 · 입문</span></div>
<h1>딥러닝 첫걸음</h1><p class="sub">신경망 → 활성화 함수 → 손실 함수 → 역전파 · 약 10~20분</p>
<div class="card"><h3>단원 선택</h3><div class="units" id="units" aria-label="학습 단원"></div><p class="mini" id="progress-label">0 / 4 단원 학습 완료</p><div class="progress" aria-hidden="true"><i id="progress-bar" style="width:0%"></i></div></div>
<section class="card" id="lesson" aria-live="polite"></section>
<section class="card hidden" id="finish"><h2>입문 학습 완료 🎉</h2><p class="muted">신경망의 예측부터 역전파의 가중치 업데이트까지 연결했어요. 이는 개념·문제·회상 입문 과정이며 실제 딥러닝 모델 훈련을 완료했다는 뜻은 아니에요.</p><button class="secondary" id="again">처음부터 다시 학습</button></section>
<p class="mini" id="storage-status" role="status"></p><p class="footer">딥러닝 입문 · 독립 과목 저장<br>기존 Python·Linux·ML 기록과 XP·츄르는 변경되지 않아요</p>
</main><nav class="meowde-tabbar" aria-label="MEOWDE 메인 메뉴"><a href="/?tab=home" aria-label="기존 먀오드 홈">⌂<span>홈</span></a><a class="selected" href="#units" aria-label="현재 딥러닝 학습" aria-current="page">▤<span>학습</span></a><a href="/python-lab.html?view=overview" aria-label="기존 먀오드 심화">⌘<span>심화</span></a><a href="/together.html" aria-label="기존 먀오드 함께">♧<span>함께</span></a><a href="/?tab=my" aria-label="기존 먀오드 마이">♙<span>마이</span></a></nav><script>
'use strict';
// Mirrors the existing ML foundations concept → deterministic practice → explanation flow.
// Unlike Production this standalone learning preview intentionally uses only in-memory state.
const units=[
 {id:'network',title:'1 · 신경망',concept:'신경망은 입력값을 받아 가중치를 곱하고 편향을 더한 뒤, 여러 층을 거쳐 출력을 만드는 모델이에요. 뉴런 하나는 z = wx + b처럼 계산할 수 있어요.',example:'입력 x = 3\n가중치 w = 2, 편향 b = 1\n계산: z = 2 × 3 + 1 = 7',q:'x=4, w=3, b=2일 때 뉴런의 활성화 전 값 z는?',choices:['12','14','18'],correct:1,why:'z = wx + b = 3×4+2 = 14예요. 편향을 더하는 것을 잊지 마세요.',recall:'신경망 뉴런이 입력에 적용하는 두 가지 매개변수는?',recallChoices:['가중치와 편향','학습률과 에포크','정확도와 정밀도'],recallAnswer:0,recallWhy:'가중치(w)는 입력 영향력을 조절하고 편향(b)은 출력 기준점을 이동시켜요.'},
 {id:'activation',title:'2 · 활성화 함수',concept:'활성화 함수는 뉴런 출력에 비선형성을 더해요. 대표적인 ReLU는 음수면 0, 양수면 그 값을 그대로 내보내요. 비선형성이 없으면 선형 층을 여러 개 쌓아도 전체는 선형 변환이에요.',example:'ReLU(z) = max(0, z)\nReLU(-3) = 0\nReLU(5) = 5',q:'ReLU에 -2가 입력되면 출력은?',choices:['-2','0','2'],correct:1,why:'ReLU는 max(0, -2)이므로 0이에요.',recall:'신경망에서 비선형 활성화 함수를 사용하는 핵심 이유는?',recallChoices:['모든 가중치를 0으로 만들기 위해','비선형 관계를 표현하기 위해','데이터 개수를 줄이기 위해'],recallAnswer:1,recallWhy:'활성화 함수는 모델이 단순한 선형 관계를 넘어서 복잡한 패턴을 표현하도록 도와요.'},
 {id:'loss',title:'3 · 손실 함수',concept:'손실 함수는 모델 예측이 실제 정답과 얼마나 다른지 숫자로 나타내요. 예를 들어 평균제곱오차(MSE)는 각 오차를 제곱해 평균내요. 학습은 이 손실을 줄이는 방향으로 진행돼요.',example:'실제값 y = 4, 예측값 ŷ = 2\n한 샘플의 제곱오차 = (4 - 2)² = 4',q:'실제값 3, 예측값 5일 때 한 샘플의 제곱오차는?',choices:['-2','2','4'],correct:2,why:'(3-5)² = (-2)² = 4예요. 제곱오차는 음수가 될 수 없어요.',recall:'손실 함수의 주요 역할은?',recallChoices:['모델 예측의 오류를 측정하기','가중치를 무작위로 초기화하기','입력 데이터를 숨기기'],recallAnswer:0,recallWhy:'손실은 예측이 얼마나 틀렸는지 측정하고 업데이트 방향을 정하는 데 사용돼요.'},
 {id:'backprop',title:'4 · 역전파',concept:'역전파는 출력에서 계산한 손실의 기울기를 연쇄법칙으로 앞쪽 층까지 전달하는 방법이에요. 옵티마이저는 그 기울기를 사용해 가중치를 업데이트해요. 역전파와 가중치 업데이트는 서로 관련 있지만 같은 단계는 아니에요.',example:'현재 가중치 w = 2\n손실 기울기 dL/dw = 3\n학습률 η = 0.1\n경사하강법: w ← 2 - 0.1 × 3 = 1.7',q:'w=5, 손실 기울기=2, 학습률=0.1일 때 업데이트된 w는?',choices:['4.8','5.2','3'],correct:0,why:'w_new = w - 학습률×기울기 = 5 - 0.1×2 = 4.8이에요.',recall:'역전파의 가장 정확한 설명은?',recallChoices:['정답을 외워서 저장하는 과정','손실의 기울기를 앞쪽 층으로 전달하는 과정','추론할 때 정답 레이블을 숨기는 과정'],recallAnswer:1,recallWhy:'역전파가 기울기를 계산하고, 경사하강법 등의 옵티마이저가 기울기로 매개변수를 갱신해요.'}
];
const STORAGE_KEY='meowde-deep-foundations-v1';
const VALID_IDS=new Set(units.map(u=>u.id));
let storageWritable=true;
let previousRecord=null;
let storageMessage='';
const state={current:0,completed:new Set(),answered:false,practiceCorrect:false,recallCorrect:false};
function loadProgress(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  if(raw===null)return;
  const doc=JSON.parse(raw);
  if(!doc||doc.version!==1||!Array.isArray(doc.done)||doc.done.some(x=>!VALID_IDS.has(x))||typeof doc.current!=='string'||!VALID_IDS.has(doc.current))throw Error('unsupported state');
  previousRecord=doc;
  state.completed=new Set(doc.done);
  state.current=units.findIndex(u=>u.id===doc.current);
 }catch(_){storageWritable=false;storageMessage='기존 딥러닝 기록을 읽지 못했어요. 원본을 덮어쓰지 않습니다.';}
}
function saveProgress(){
 if(!storageWritable){document.getElementById('storage-status').textContent=storageMessage;return false;}
 const proposed={...(previousRecord||{}),version:1,current:units[state.current].id,done:units.filter(u=>state.completed.has(u.id)).map(u=>u.id)};
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(proposed));previousRecord=proposed;storageMessage='';document.getElementById('storage-status').textContent='이 브라우저에 딥러닝 진도를 저장했어요.';return true;
 }catch(_){storageMessage='저장하지 못했어요. 기존 기록은 그대로이며, 공간·권한 확인 후 다시 시도하세요.';document.getElementById('storage-status').textContent=storageMessage;return false;}
}
loadProgress();
const $=id=>document.getElementById(id);
function grade(unitId,stage,index){const u=units.find(x=>x.id===unitId);if(!u||!['practice','recall'].includes(stage)||!Number.isInteger(index))return null;const correctIndex=stage==='practice'?u.correct:u.recallAnswer;const choices=stage==='practice'?u.choices:u.recallChoices;if(index<0||index>=choices.length)return null;return {correct:index===correctIndex,reason:stage==='practice'?u.why:u.recallWhy,answer:choices[correctIndex]};}
function el(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e;}
function updateNav(){const nav=$('units');nav.replaceChildren();units.forEach((u,i)=>{const b=el('button','unit',u.title+(state.completed.has(u.id)?' ✓':''));b.type='button';b.setAttribute('aria-current',String(i===state.current));b.onclick=()=>{state.current=i;saveProgress();state.answered=false;state.practiceCorrect=false;state.recallCorrect=false;render();};nav.append(b)});$('progress-label').textContent=state.completed.size+' / 4 단원 학습 완료';$('progress-bar').style.width=(state.completed.size/4*100)+'%';}
function choicePanel(u,stage){const isRecall=stage==='recall';const block=el('section','step');const heading=el('h3','',isRecall?'3단계 · 스스로 회상하기':'2단계 · 문제로 적용하기');const p=el('p','question',isRecall?u.recall:u.q);block.append(heading,p);const choices=el('div','choices');const feedback=el('div','feedback');feedback.setAttribute('role','status');const list=isRecall?u.recallChoices:u.choices;
list.forEach((c,i)=>{const btn=el('button','answer',c);btn.type='button';btn.onclick=()=>{const r=grade(u.id,stage,i);if(!r)return;feedback.textContent=(r.correct?'정답! ':'다시 확인해요. 정답: '+r.answer+'. ')+r.reason;list.forEach((_,j)=>{choices.children[j].className='answer'+(j=== (isRecall?u.recallAnswer:u.correct)?' correct':j===i&&!r.correct?' wrong':'')});if(r.correct){if(isRecall){if(!state.practiceCorrect){feedback.textContent='먼저 2단계 적용 문제를 풀어 주세요.';return;}state.recallCorrect=true;
      const alreadyDone=state.completed.has(u.id);
      state.completed.add(u.id);
      if(!saveProgress()&&!alreadyDone){state.completed.delete(u.id);state.recallCorrect=false;feedback.textContent='정답이에요. 하지만 완료 기록을 저장하지 못했어요. 저장 문제를 해결한 뒤 다시 제출해 주세요.';}
      updateNav();}else state.practiceCorrect=true;renderNext();}};choices.append(btn)});block.append(choices,feedback);return block;}
function renderNext(){const target=$('next-area');if(!target)return;target.replaceChildren();const u=units[state.current];if(!state.practiceCorrect){target.append(el('p','muted','먼저 적용 문제에 정답을 맞혀 보세요.'));return;}if(!state.recallCorrect){target.append(el('p','muted','이제 설명을 가리고 회상 문제를 풀어 보세요.'));return;}const next=el('button','primary',state.current<3?'다음 단원 →':'전체 학습 결과 보기');next.onclick=()=>{if(state.current<3){state.current++;saveProgress();state.practiceCorrect=false;state.recallCorrect=false;render();window.scrollTo(0,0)}else{$('lesson').classList.add('hidden');$('finish').classList.remove('hidden');window.scrollTo(0,0)}};target.append(next)}
function render(){updateNav();$('finish').classList.add('hidden');$('lesson').classList.remove('hidden');const u=units[state.current],area=$('lesson');area.replaceChildren();area.append(el('p','kicker','1단계 · 핵심 개념'),el('h2','',u.title),el('p','concept',u.concept),el('pre','example',u.example),choicePanel(u,'practice'),choicePanel(u,'recall'));const next=el('div','step');next.id='next-area';area.append(next);renderNext();}
$('again').onclick=()=>{state.current=0;state.practiceCorrect=false;state.recallCorrect=false;saveProgress();render();window.scrollTo(0,0)};
render();
if(storageMessage)document.getElementById('storage-status').textContent=storageMessage;
</script><script data-subject="dl" src="/assets/meowde-unified-shell-review.js?v=1"></script></body></html>
