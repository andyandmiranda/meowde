<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowde v4.53 — Loading</title>
  <style>
    html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#fff9ef;color:#2d2a28;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{font-weight:800;letter-spacing:-.02em}.error{max-width:320px;padding:24px;text-align:center;line-height:1.6}
  </style>
</head>
<body>
  <div class="loading" id="status">Meowde를 준비하고 있어요…</div>
  <script>
    (async()=>{
      const VERSION="453";
      const DISPLAY_VERSION="4.53";
      const status=document.getElementById("status");
      let preferredLanguage="ko";
      try{
        const saved=localStorage.getItem("meowde-v410-state");
        if(saved){
          try{
            const parsed=JSON.parse(saved);
            preferredLanguage=parsed&&parsed.lang==="en"?"en":"ko";
          }catch(error){
            localStorage.setItem("meowde-v425-state-backup",saved);
            localStorage.removeItem("meowde-v410-state");
          }
        }
        document.documentElement.lang=preferredLanguage;
        status.textContent=preferredLanguage==="en"?"Preparing Meowde…":"Meowde를 준비하고 있어요…";
        const response=await fetch(`/index.html?v=${VERSION}`,{cache:"no-store"});
        if(!response.ok)throw new Error(`HTTP ${response.status}`);
        let html=await response.text();
        html=html.replace(/<html\b[^>]*>/i,`<html lang="${preferredLanguage}">`);
        html=html.replace(/<title>[\s\S]*?<\/title>/i,`<title>Meowde v${DISPLAY_VERSION}</title>`);
        const styles=[
          ["v413-ux.css","413"],["v414-ux.css","414"],["v415-ux.css","415"],["v416-ux.css","416"],["v417-ux.css","417"],["v418-coach.css","418"],["v419-achievements.css","439"],["v420-profile.css","420"],["v421-vault.css","421"],["v422-pwa.css",VERSION],["v423-brand.css","439"],["v425-playful.css","439"],["v429-quests.css","429"],["v430-character.css",VERSION],["v431-stability.css","431"],["v432-humor.css","432"],["v433-learning.css","433"],["v434-release.css",VERSION],["v443-single-companion.css",VERSION]
        ];
        const headMarkup=[
          `<link rel="manifest" href="/manifest.webmanifest?v=${VERSION}">`,
          '<meta name="theme-color" content="#53c7a0">',
          '<meta name="apple-mobile-web-app-capable" content="yes">',
          '<meta name="apple-mobile-web-app-status-bar-style" content="default">',
          '<meta name="apple-mobile-web-app-title" content="Meowde">',
          `<link rel="apple-touch-icon" href="/icons/meowde-180.png?v=${VERSION}">`,
          ...styles.map(([file,version])=>`<link rel="stylesheet" href="/${file}?v=${version}">`),
          "</head>"
        ].join("");
        html=html.replace("</head>",headMarkup);
        const scripts=[
          ["v412-hotfix.js","412"],["v413-core.js","413"],["v413-lesson.js","413"],["v414-state.js","414"],["v414-reward.js","414"],["v414-screens.js","414"],["v415-retention.js","415"],["v416-journey.js","416"],["v417-review.js","417"],["v418-coach.js","418"],["v420-profile.js","420"],["v421-vault.js","421"],["v422-pwa.js",VERSION],["v423-character.js","439"],["v425-state.js","425"],["v419-achievements.js","439"],["v425-playful.js","439"],["v427-growth.js","439"],["v428-events.js","428"],["v429-quests.js","429"],["v430-character.js",VERSION],["v431-stability.js","431"],["v432-humor.js","432"],["v433-learning.js","433"],["v443-single-companion.js",VERSION],["v434-release.js",VERSION]
        ];
        html=html.replace("</body>",[...scripts.map(([file,version])=>`<script src="/${file}?v=${version}"><\\/script>`),"</body>"].join(""));
        document.open();document.write(html);document.close();
      }catch(error){
        console.error(`Meowde v${DISPLAY_VERSION} bootstrap failed`,error);
        status.className="error";
        status.textContent=preferredLanguage==="en"?"Meowde could not be loaded. Please try again shortly.":"Meowde를 불러오지 못했습니다. 잠시 후 다시 접속해 주세요.";
      }
    })();
  </script>
</body>
</html>
