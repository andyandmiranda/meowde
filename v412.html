<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meowde v4.27 — Loading</title>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #fff9ef;
      color: #2d2a28;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .loading {
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .error {
      max-width: 320px;
      padding: 24px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="loading" id="status">
    Meowde를 준비하고 있어요…
  </div>

  <script>
    (async () => {
      const status = document.getElementById("status");

      try {
        const saved = localStorage.getItem("meowde-v410-state");

        if (saved) {
          try {
            JSON.parse(saved);
          } catch (error) {
            localStorage.setItem("meowde-v425-state-backup", saved);
            localStorage.removeItem("meowde-v410-state");
          }
        }

        const response = await fetch("/index.html?v=427", {
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        let html = await response.text();

        html = html.replace(
          /<title>[\s\S]*?<\/title>/i,
          "<title>Meowde v4.27 — Growth & Emotion Memory</title>"
        );

        html = html.replace(
          "</head>",
          [
            '<link rel="manifest" href="/manifest.webmanifest">',
            '<meta name="theme-color" content="#53c7a0">',
            '<meta name="apple-mobile-web-app-capable" content="yes">',
            '<meta name="apple-mobile-web-app-status-bar-style" content="default">',
            '<meta name="apple-mobile-web-app-title" content="Meowde">',
            '<link rel="apple-touch-icon" href="/icons/meowde-180.png">',
            '<link rel="stylesheet" href="/v413-ux.css?v=413">',
            '<link rel="stylesheet" href="/v414-ux.css?v=414">',
            '<link rel="stylesheet" href="/v415-ux.css?v=415">',
            '<link rel="stylesheet" href="/v416-ux.css?v=416">',
            '<link rel="stylesheet" href="/v417-ux.css?v=417">',
            '<link rel="stylesheet" href="/v418-coach.css?v=418">',
            '<link rel="stylesheet" href="/v419-achievements.css?v=419">',
            '<link rel="stylesheet" href="/v420-profile.css?v=420">',
            '<link rel="stylesheet" href="/v421-vault.css?v=421">',
            '<link rel="stylesheet" href="/v422-pwa.css?v=422">',
            '<link rel="stylesheet" href="/v423-brand.css?v=423">',
            '<link rel="stylesheet" href="/v425-playful.css?v=425">',
            '<style>.v427-growth-card,.v427-emotion-card{display:grid;gap:12px}.v427-growth-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.v427-stage-icon{font-size:30px}.v427-growth-track{height:9px;border-radius:999px;background:#f0e7da;overflow:hidden}.v427-growth-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--mint),var(--butter));transition:width .35s ease}.v427-growth-stages{display:flex;justify-content:space-between;gap:6px}.v427-growth-stages span{opacity:.35;filter:grayscale(1);font-size:18px}.v427-growth-stages span.reached{opacity:1;filter:none}.v427-emotion-card>div{display:flex;align-items:center;gap:8px}.v427-emotion-card p{margin:0;color:var(--muted);line-height:1.55}.v427-emotion-dot{width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 5px rgba(83,199,160,.12)}.v427-emotion-line{margin-top:6px;font-size:12px;font-weight:800;color:var(--muted)}@media(max-width:360px){.v427-growth-head{grid-template-columns:auto 1fr}.v427-growth-head>.pill{grid-column:2;justify-self:start}}</style>',
            "</head>",
          ].join("")
        );

        html = html.replace(
          "</body>",
          [
            '<script src="/v412-hotfix.js?v=412"><\/script>',
            '<script src="/v413-core.js?v=413"><\/script>',
            '<script src="/v413-lesson.js?v=413"><\/script>',
            '<script src="/v414-state.js?v=414"><\/script>',
            '<script src="/v414-reward.js?v=414"><\/script>',
            '<script src="/v414-screens.js?v=414"><\/script>',
            '<script src="/v415-retention.js?v=415"><\/script>',
            '<script src="/v416-journey.js?v=416"><\/script>',
            '<script src="/v417-review.js?v=417"><\/script>',
            '<script src="/v418-coach.js?v=418"><\/script>',
            '<script src="/v419-achievements.js?v=426"><\/script>',
            '<script src="/v420-profile.js?v=420"><\/script>',
            '<script src="/v421-vault.js?v=421"><\/script>',
            '<script src="/v422-pwa.js?v=422"><\/script>',
            '<script src="/v423-character.js?v=423"><\/script>',
            '<script src="/v425-state.js?v=425"><\/script>',
            '<script src="/v425-playful.js?v=426"><\/script>',
            '<script src="/v427-growth.js?v=427"><\/script>',
            "</body>",
          ].join("")
        );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error("Meowde v4.27 bootstrap failed", error);

        status.className = "error";
        status.textContent =
          "Meowde를 불러오지 못했습니다. 잠시 후 다시 접속해 주세요.";
      }
    })();
  </script>
</body>
</html>
