let state={version:1,unit:0,step:0,done:{}};try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&parsed.version===1)state={...state,...parsed,done:parsed.done&&typeof parsed.done==="object"?parsed.done:{}}}}catch{}
const requested=Number(new URLSearchParams(location.search).get("unit"));const selectedUnit=Number.isInteger(requested)&&requested>=1&&requested<=U.length?requested-1:null;state.stepByUnit=state.stepByUnit&&typeof state.stepByUnit==="object"&&!Array.isArray(state.stepByUnit)?state.stepByUnit:{};if(Number.isInteger(state.unit)&&state.unit>=0&&state.unit<U.length&&Number.isInteger(state.step)&&state.step>=0&&state.step<=4&&state.stepByUnit[state.unit]===undefined)state.stepByUnit[state.unit]=state.step;if(selectedUnit!==null&&selectedUnit!==state.unit){state.unit=selectedUnit;state.step=Number.isInteger(state.stepByUnit[selectedUnit])?state.stepByUnit[selectedUnit]:0;}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));const notice=document.getElementById("save-warning");if(notice)notice.textContent="";return true}catch{return false}}
function commitProgress(change){const previous=JSON.parse(JSON.stringify(state));change();state.stepByUnit[state.unit]=state.step;if(save())return true;state=previous;const notice=document.getElementById("save-warning");if(notice)notice.textContent="진도를 저장하지 못했어요. 이전 진행 상태를 유지했어요. 저장 공간을 확인한 뒤 다시 시도해 주세요.";return false;}
function solvedAtCurrentStep(){return !!(state.confirmedByUnit&&state.confirmedByUnit[state.unit]===state.step&&state.step>=1&&state.step<=3)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderGrid(){document.getElementById("course-progress").textContent=Object.keys(state.done).filter(k=>state.done[k]).length+" / "+U.length+"단원 완료";}
function render(){document.querySelectorAll('a[href^="/linux-home.html?tab=learn"]').forEach(link=>{link.href="/linux-home.html?tab=learn&group="+(Math.floor(state.unit/3)+1);});renderGrid();const u=U[state.unit],card=document.getElementById("lesson-card");const qIndex=state.step-1;let body='<span class="level">단원 '+(state.unit+1)+' / '+U.length+'</span><h2>'+esc(u[0])+'</h2><p>'+esc(u[1])+'</p><div class="stage"><span class="'+(state.step===0?'on':'')+'">개념</span><span class="'+(state.step===1?'on':'')+'">Lv1</span><span class="'+(state.step===2?'on':'')+'">Lv2</span><span class="'+(state.step===3?'on':'')+'">Lv3</span></div>';
if(state.step===0){body+='<h3>핵심 개념</h3><p>'+esc(u[2])+'</p><pre class="code">'+esc(u[3])+'</pre><button class="primary" id="start-q">난이도별 문제 시작 →</button>';}
else if(state.step>=1&&state.step<=3){const q=u[4][qIndex];body+='<span class="level">'+esc(q[0])+'</span><h3>'+esc(q[1])+'</h3><div class="answers">'+q[2].map((a,i)=>'<button data-answer="'+i+'">'+esc(a)+'</button>').join("")+'</div><p class="feedback" id="feedback"></p>';}
else{body+='<h3>단원 완료 🎉</h3><p>개념과 Lv1~Lv3 확인 문제를 모두 통과했어요.</p><div class="foot-actions"><button class="secondary" id="review-unit">이 단원 다시 보기</button>'+(state.unit<U.length-1?'<button class="primary" id="next-unit">다음 단원 →</button>':'<button class="primary" id="go-practice">심화 실습 보기 →</button>')+'</div>';}
card.innerHTML=body;
