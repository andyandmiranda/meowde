<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Robotics · Meowde</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>
:root{--mint:#53C7A0;--cream:#FFF9EF;--ink:#2D2A28;--muted:#7F7671;--line:#E8DED0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#FFF4DA,#E8F8F0);color:var(--ink);font-family:"Pretendard Variable",Pretendard,sans-serif}.app{max-width:680px;min-height:100dvh;margin:auto;padding:20px;background:var(--cream)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}a{color:inherit;text-decoration:none}.back,.tag{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 13px;font-size:12px;font-weight:800}h1{font-size:25px;letter-spacing:-.05em;margin:14px 0 4px}h2{font-size:19px;margin:6px 0 12px}p{line-height:1.55}.sub{color:var(--muted);font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.pill{display:inline-block;background:#E7F8F0;color:#247B61;border-radius:30px;padding:6px 10px;font-size:11px;font-weight:900}.progress{height:9px;background:#F0E7DA;border-radius:20px;overflow:hidden;margin:12px 0}.progress>span{display:block;height:100%;background:var(--mint)}button{font:inherit;cursor:pointer}.btn{background:var(--mint);color:white;border:0;border-radius:14px;padding:13px 17px;font-weight:900}.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.units{display:grid;gap:8px;margin-top:12px}.unit{border:1px solid var(--line);border-radius:15px;padding:13px;text-align:left;background:white}.unit.on{border-color:var(--mint);background:#E7F8F0}.unit small{display:block;color:var(--muted);margin-top:4px}.tasks{display:grid;gap:8px}.task{border:1px solid var(--line);border-radius:14px;padding:12px;background:white;text-align:left}.task.done{background:#E7F8F0;border-color:#BDEBD8}.task small{display:block;color:var(--muted);margin-top:4px}pre{background:#24201F;color:#FFF6E9;padding:14px;border-radius:14px;overflow:auto;white-space:pre-wrap;line-height:1.7}.answers{display:grid;gap:8px;margin-top:12px}.answers button{background:white;border:1px solid var(--line);border-radius:12px;text-align:left;padding:12px}.answers button:disabled{opacity:.8;cursor:default}.answers .ok{border-color:#53C7A0;background:#E7F8F0}.answers .bad{border-color:#F46D82;background:#FFE9ED}.hidden{display:none}input{padding:12px;width:100%;border:1px solid var(--line);border-radius:12px;font:inherit}footer{font-size:12px;color:var(--muted);padding:18px 0}</style></head><body><div class="app"><header><a class="back" href="/">← Meowde</a><span class="tag">NVIDIA AI Campus · STEP 1</span></header><h1>AI Robotics · Linux</h1><p class="sub">강의 개념, 실습 E1~E7, 명령어 연습을 한곳에서. 진행 상황은 이 브라우저에 자동 저장돼요.</p><section class="card"><div class="row"><b>학습 진행</b><span id="stat">0개 완료</span></div><div class="progress"><span id="bar" style="width:0%"></span></div><button class="btn" id="resume">이어서 공부하기 →</button></section><section id="units" class="units"></section><section id="viewer" class="card"></section><footer>강의자료를 기반으로 만든 보조 학습 모드입니다. 실습 명령어는 이 화면에서 실제 시스템에 실행되지 않습니다. 공식 과제 채점은 원본 ZIP의 check.sh에서 확인하세요.</footer></div><script>
const DATA=[
{title:"E1 · 파일·디렉터리",topics:"pwd · ls · cd · mkdir · touch · cp · mv · rm",tasks:["현재 위치와 파일 목록 확인","중첩 디렉터리 생성","빈 파일 생성과 파일 이동","원본 파일 복사","불필요한 파일 및 빈 폴더 삭제","확장자별 자동 분류","파일 이동과 이름 변경","폴더 전체 복사","중복 파일명 충돌 방지","프로젝트 폴더 이전"],quiz:[["현재 위치를 출력하는 명령어는?",["pwd","ps","ls"],0,"pwd = Print Working Directory"],["하위 폴더까지 복사하려면?",["cp -r","mv -l","ls -a"],0,"-r = recursive (재귀적으로)"]]},
{title:"E2 · 파일 읽기·편집",topics:"cat · head · tail · nano · vim",tasks:["회사 폴더 구조와 직원 명부 수정","서버 로그의 오류 지점 조사","nano로 할 일 목록 편집","문서 파일 복사","파일 종류별 분류","불필요한 파일 정리","문서 읽고 줄 번호 기록","vim으로 파일 수정","vim으로 파일 내용 합치기","편집·조회 종합 연습"],quiz:[["파일 마지막 5줄을 출력하려면?",["head -5","tail -5","pwd -5"],1,"tail = 끝부분"],["vim에서 입력 모드 진입 키는?",["i","q","w"],0,"i = insert (입력)"]]},
{title:"E3 · 검색",topics:"find · grep · 검색 패턴",tasks:["파일 이름으로 경로 찾기","내용 검색하기","특정 단어의 줄 번호 찾기","공지의 긴급 항목 확인","백업 파일 개수 세기","Python 파일 경로 수집","빈 디렉터리 찾기","로그의 ERROR 줄 조사","코드의 하드코딩된 키 수정","백업 및 비밀번호 정리"],quiz:[["파일 내용 중 ERROR가 있는 줄을 찾으려면?",["grep ERROR app.log","find ERROR app.log","tail ERROR"],0,"grep은 내용 패턴을 찾는 명령어"],["디렉터리 아래 파일을 이름으로 검색하려면?",["find","chmod","sudo"],0,"find = 찾기"]]},
{title:"E4 · 로그·파이프",topics:"sort · awk · | · > · >>",tasks:["로그에서 조건 검색","파이프로 명령 연결","특정 필드 추출","조건별 통계 확인","정렬 결과 저장","중복 기록 확인","여러 로그 결합","로그 요청 수 분석","리디렉션 연습","종합 로그 분석"],quiz:[["출력을 파일 끝에 추가하려면?",[">",">>","|"],1,">>는 추가, >는 덮어쓰기"],["앞 명령 출력을 뒤 명령의 입력으로 보내려면?",["|",";","&"],0,"|는 파이프"]]},
{title:"E5 · 권한·그룹",topics:"ls -l · chmod · umask · chown · chgrp · usermod",tasks:["서버 파일 권한 점검","배포 스크립트 755·비밀번호 파일 600","팀 공유 문서 쓰기 권한 제한","업로드 폴더 기본 권한 강화 (umask)","분기 보고서의 소유 그룹 변경","설정 파일 소유자·그룹 변경","마케팅 그룹 신설","계정을 interns 그룹에 추가","팀 공유 폴더 접근 범위 설정","파일 서버 보안 감사"],quiz:[["소유자만 읽고 쓸 수 있게 하려면?",["chmod 600 file","chmod 777 file","chmod 755 file"],0,"6=4(read)+2(write), 0은 권한 없음"],["기존 그룹 소속을 유지하며 새 그룹에 추가하려면?",["usermod -G","usermod -aG","chgrp"],1,"-a = append, -G = supplementary groups"],["새 파일 기본 권한을 제한하는 마스크는?",["umask","uname","usermod"],0,"umask는 새 파일·폴더 생성 시 권한을 제한해"]]},
{title:"E6 · 프로세스",topics:"ps · PID · PPID · top · jobs · kill · watch",tasks:["현재 프로세스 조회","프로세스 PID 확인","부모 프로세스 확인","상태별 프로세스 관찰","실시간 CPU 사용량 관찰","백그라운드 작업 관리","프로세스 종료","일반 종료와 강제 종료 비교","주기적 명령 실행","프로세스 종합 관리"],quiz:[["전체 사용자 프로세스를 확인하려면?",["ps aux","pwd","ls -l"],0,"ps = Process Status"],["기본 종료 요청 명령은?",["kill PID","kill -9 PID","chmod PID"],0,"kill은 기본적으로 SIGTERM 신호를 보내"]]},
{title:"E7 · 패키지",topics:"apt update · search · install · show · remove",tasks:["패키지 목록 갱신·검색","필요한 패키지 설치","패키지 버전·정보 조사","설치 상태 점검","불필요한 패키지 제거"],quiz:[["패키지 목록 정보만 갱신하려면?",["apt update","apt remove","apt install"],0,"update는 패키지 목록을 갱신해"],["새 패키지를 설치하려면?",["apt show","apt install","apt search"],1,"install = 설치"]]}
];
const KEY="meowde-linux-robotics-v1";let state;try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}};state.done=state.done||{};state.quiz=state.quiz||{};state.unit=Number.isInteger(state.unit)?state.unit:0;state.task=Number.isInteger(state.task)?state.task:0;let answered=-1;
const $=x=>document.getElementById(x),save=()=>{localStorage.setItem(KEY,JSON.stringify(state))},esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){const total=DATA.reduce((n,u)=>n+u.tasks.length,0),completed=Object.keys(state.done).filter(k=>state.done[k]).length;$("stat").textContent=completed+" / "+total+"개 완료";$("bar").style.width=(100*completed/total)+"%";$("units").innerHTML=DATA.map((u,i)=>'<button class="unit '+(i===state.unit?"on":"")+'" onclick="openUnit('+i+')"><b>'+esc(u.title)+'</b><small>'+esc(u.topics)+' · '+u.tasks.filter((_,j)=>state.done[i+"-"+j]).length+'/'+u.tasks.length+' 완료</small></button>').join("");const u=DATA[state.unit],t=state.task;let html='<div class="row"><span class="pill">'+esc(u.title)+'</span><span class="sub">'+(t+1)+'/'+u.tasks.length+'</span></div><h2>'+esc(u.tasks[t])+'</h2><p class="sub">실제 문제는 다운로드한 해당 ZIP의 '+String(t+1).padStart(2,"0")+'/README.txt와 함께 풀어주세요. 아래는 동일 주제의 연습·복습이에요.</p><pre>cat README.txt\n# 설명을 읽은 뒤 Ubuntu에서 직접 실행\n# 완료 후 상위 폴더에서 bash check.sh</pre><div class="row"><button class="btn ghost" onclick="prevTask()">← 이전</button><button class="btn" onclick="completeTask()">'+(state.done[state.unit+"-"+t]?"완료됨 · 다음 →":"학습 완료 · 다음 →")+'</button></div><h2 style="margin-top:24px">짧은 개념 퀴즈</h2>';const arr=u.quiz;arr.forEach((q,k)=>{html+='<div class="card" style="box-shadow:none"><b>'+(k+1)+'. '+esc(q[0])+'</b><div class="answers">'+q[1].map((o,j)=>'<button class="'+(state.quiz[state.unit+"-"+k]!==undefined?(j===q[2]?"ok":j===state.quiz[state.unit+"-"+k]?"bad":""):"")+'" onclick="answer('+k+','+j+')" '+(state.quiz[state.unit+"-"+k]!==undefined?"disabled":"")+'>'+esc(o)+'</button>').join('')+'</div>'+(state.quiz[state.unit+"-"+k]!==undefined?'<p class="sub">'+esc(q[3])+'</p>':'')+'</div>'});$("viewer").innerHTML=html;save();}
function openUnit(i){state.unit=i;state.task=0;render();$("viewer").scrollIntoView({behavior:"smooth",block:"start"})}function prevTask(){state.task=Math.max(0,state.task-1);render()}function completeTask(){state.done[state.unit+"-"+state.task]=true;if(state.task+1<DATA[state.unit].tasks.length)state.task++;else if(state.unit+1<DATA.length){state.unit++;state.task=0}render()}function answer(k,j){state.quiz[state.unit+"-"+k]=j;render()}$("resume").onclick=()=>{$("viewer").scrollIntoView({behavior:"smooth",block:"start"})};render();
</script></body></html>
