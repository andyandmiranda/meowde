<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이전 Linux 학습 기록 · Meowde</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/assets/linux-guided.css"><link rel="stylesheet" href="/assets/meowde-unified-ui.css"></head><body><main class="shell"><header class="top"><a href="/linux-home.html">← Linux 홈</a><span class="brand">MEOWDE</span></header><p class="eyebrow">학습 기록</p><h1>배운 흔적은<br>그대로 남아 있어요.</h1><p class="muted">이전 버전에서 저장한 완료 기록이에요. 새 학습을 시작해도 이 기록은 바뀌지 않아요.</p><section class="lesson-card"><h2 id="record-count">학습 기록 확인 중</h2><ul class="records" id="records"></ul></section><a class="primary" href="/linux-home.html">새 Linux 학습 시작하기 →</a><a class="legal" href="/content-notice.html">학습 콘텐츠 안내</a></main><script>
(function(){"use strict";const KEY="meowde-linux-robotics-v1";let state={};try{state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}const done=state.done&&typeof state.done==="object"?state.done:{};const keys=Object.keys(done).filter(k=>done[k]&&/^\d+-\d+$/.test(k));document.getElementById("record-count").textContent=keys.length+"개 연습 완료";const list=document.getElementById("records");keys.forEach(k=>{const [u,t]=k.split("-").map(Number);const li=document.createElement("li");li.textContent="이전 단원 "+(u+1)+" · 연습 "+(t+1);list.append(li)});if(!keys.length){const li=document.createElement("li");li.textContent="이 브라우저에 저장된 완료 기록이 없어요.";list.append(li)}})();</script><script src="/assets/linux-shared-navigation.js"></script></body></html>
