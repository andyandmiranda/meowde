<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEOWDE 공통 셸 통합 실험</title><link rel="stylesheet" href="/experiments/common-shell-v1.css"><style>body{margin:0;font-family:system-ui,sans-serif;background:#fffafc}.trial{max-width:680px;margin:auto}.notice{font-size:12px;padding:8px 12px;background:#fff1f6}iframe{display:block;width:100%;height:calc(100dvh - 205px);min-height:350px;border:0;background:white;box-sizing:border-box}@media(max-width:340px){.trial{width:100%}.notice{font-size:11px}.meowde-common-header{padding:8px}.meowde-common-tabs{padding:4px 0}.meowde-common-tabs a{font-size:12px}}.meowde-common-tabs{position:sticky;bottom:0}a:focus-visible,select:focus-visible{outline:3px solid #80556a}</style></head><body><div class="trial"><p class="notice">격리 통합 실험 · 기존 학습 화면을 수정하지 않음 · 내부 메뉴는 격리 화면에서만 숨김 · 통합 전 QA용</p><div id="shell"></div><iframe id="course" title="기존 과목 학습 화면"></iframe></div><script src="/experiments/common-shell-v1.js"></script><script>(function(){const p=new URLSearchParams(location.search),s=p.get("subject"),subjects=MeowdeCommonShellV1.subjects,subject=Object.prototype.hasOwnProperty.call(subjects,s)?s:"python";MeowdeCommonShellV1.mount(document.getElementById("shell"),subject,"learn");const iframe=document.getElementById("course");iframe.name="course-frame";iframe.src=MeowdeCommonShellV1.hrefs(subject).learn;document.querySelectorAll(".meowde-common-tabs a,.meowde-common-map").forEach(a=>{a.setAttribute("target","course-frame")});iframe.addEventListener("load",()=>{try{const inner=iframe.contentDocument;if(!inner)return;const css=inner.createElement("style");css.textContent=".tabbar,.linux-tabbar,.meowde-lab-tabbar,.meowde-tabbar{display:none!important}";inner.head.append(css);}catch(_){document.querySelector(".notice").textContent+=" · 내부 메뉴 숨김 미지원";}});})();</script></body></html>
