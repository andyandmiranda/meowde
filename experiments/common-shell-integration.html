<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEOWDE 공통 셸 통합 실험</title><link rel="stylesheet" href="/experiments/common-shell-v1.css"><style>body{margin:0;font-family:system-ui,sans-serif;background:#fffafc}.trial{max-width:680px;margin:auto}.notice{font-size:12px;padding:8px 12px;background:#fff1f6}iframe{display:block;width:100%;height:calc(100dvh - 205px);min-height:350px;border:0;background:white}.meowde-common-tabs{position:sticky;bottom:0}a:focus-visible,select:focus-visible{outline:3px solid #80556a}</style></head><body><div class="trial"><p class="notice">격리 통합 실험 · 기존 학습 화면을 수정하지 않음 · 화면 내부의 기존 메뉴는 중복될 수 있음</p><div id="shell"></div><iframe id="course" title="기존 과목 학습 화면"></iframe></div><script src="/experiments/common-shell-v1.js"></script><script>(function(){const p=new URLSearchParams(location.search),s=p.get("subject"),subjects=MeowdeCommonShellV1.subjects,subject=Object.prototype.hasOwnProperty.call(subjects,s)?s:"python";MeowdeCommonShellV1.mount(document.getElementById("shell"),subject,"learn");const iframe=document.getElementById("course");iframe.src=MeowdeCommonShellV1.hrefs(subject).learn;document.querySelectorAll(".meowde-common-tabs a,.meowde-common-map").forEach(a=>{if(a.getAttribute("href")===MeowdeCommonShellV1.hrefs(subject).learn)a.setAttribute("target","course-frame")});iframe.name="course-frame";})();</script></body></html>
